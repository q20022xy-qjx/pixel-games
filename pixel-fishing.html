<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>像素钓鱼</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b1840; --navy2:#2b2560; --orange:#ff9a5c; --cream:#ffe9c8;
    --sea:#2a73b5; --gold:#ffd27a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; min-height:100%}
  body{
    font-family:'DotGothic16',ui-monospace,Menlo,"PingFang SC","Microsoft YaHei",monospace;
    color:var(--cream); background:var(--navy);
    background-image:
      linear-gradient(rgba(255,154,92,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,154,92,.06) 1px, transparent 1px);
    background-size:24px 24px;
    display:flex; justify-content:center; padding:12px;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #app{width:100%; max-width:720px}
  .top{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; font-size:15px}
  .top .title{color:var(--orange); font-size:18px; letter-spacing:1px}
  .top .stats{display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
  .chip{background:var(--navy2); border:2px solid var(--cream); padding:3px 8px; font-size:14px; white-space:nowrap}
  button{
    font-family:inherit; color:var(--navy); cursor:pointer;
    background:var(--cream); border:3px solid #000; box-shadow:3px 3px 0 var(--orange);
    padding:5px 10px; font-size:14px;
  }
  button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--orange)}
  #stage{
    position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; cursor:pointer;
    border:4px solid #000; box-shadow:0 0 0 4px var(--orange), 8px 8px 0 4px rgba(0,0,0,.45);
  }
  #cv{width:100%; height:100%; display:block; image-rendering:pixelated; image-rendering:crisp-edges}
  #hint{
    position:absolute; left:50%; bottom:3%; transform:translateX(-50%);
    background:rgba(13,11,38,.82); border:2px solid var(--cream); padding:4px 12px;
    font-size:clamp(12px,2.6vw,16px); white-space:nowrap; pointer-events:none; max-width:96%;
    overflow:hidden; text-overflow:ellipsis;
  }
  #hint.alert{background:#c0392b; border-color:#fff; animation:blink .25s steps(2) infinite}
  @keyframes blink{50%{background:#ff6a3d}}
  #meterWrap{position:absolute; left:10%; right:10%; top:5%; display:none; pointer-events:none}
  #meter{position:relative; height:clamp(18px,4.5vw,28px); background:rgba(13,11,38,.9); border:3px solid var(--cream)}
  #zone{position:absolute; top:0; bottom:0; background:var(--orange); box-shadow:inset 0 0 0 2px #ffd27a}
  #marker{position:absolute; top:-5px; bottom:-5px; width:8px; margin-left:-4px; background:#fff; border:2px solid #000}
  #meter.flash{animation:flash .25s}
  @keyframes flash{50%{background:#2fbf71}}
  #pips{margin-top:6px; text-align:center; font-size:clamp(13px,3vw,18px); text-shadow:2px 2px 0 #000; letter-spacing:4px}
  #card{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(13,11,38,.7);
  }
  #card .box{
    background:var(--navy); border:4px solid var(--cream); box-shadow:6px 6px 0 var(--orange);
    padding:12px 18px; text-align:center; min-width:52%; max-width:88%;
  }
  #card h2{margin:0 0 6px; font-size:clamp(14px,3.2vw,20px); color:var(--gold); font-weight:normal}
  #card canvas{image-rendering:pixelated; margin:4px auto; display:block}
  #card .name{font-size:clamp(16px,4vw,24px)}
  #card .meta{font-size:clamp(12px,2.8vw,15px); margin-top:4px; opacity:.95}
  #card .tip{font-size:clamp(11px,2.5vw,14px); margin-top:6px; color:#b9b3e8}
  #card .tag{display:inline-block; margin:0 3px; padding:1px 6px; background:var(--orange); color:var(--navy); font-size:12px}
  #card .go{margin-top:8px; font-size:12px; opacity:.7}
  .bottom{margin-top:14px; display:flex; flex-direction:column; align-items:center; gap:8px}
  #act{
    width:100%; max-width:420px; padding:14px; font-size:20px; background:var(--orange);
    border-color:#000; box-shadow:4px 4px 0 var(--cream); color:#1b1840;
  }
  #act:active{box-shadow:1px 1px 0 var(--cream)}
  #act.alert{animation:blink .25s steps(2) infinite; background:#ff4a4a; color:#fff}
  .sub{font-size:12px; opacity:.7; text-align:center; line-height:1.6}

  #book{position:fixed; inset:0; background:rgba(13,11,38,.92); display:none; align-items:center; justify-content:center; padding:12px; z-index:10}
  #book .panel{background:var(--navy); border:4px solid var(--cream); box-shadow:6px 6px 0 var(--orange); width:100%; max-width:640px; max-height:92vh; overflow:auto; padding:12px}
  #book .hd{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:18px; color:var(--gold)}
  #grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  @media (min-width:560px){ #grid{grid-template-columns:repeat(4,1fr)} }
  .cell{background:var(--navy2); border:2px solid #4a4390; padding:6px 4px; text-align:center; font-size:12px; min-height:104px}
  .cell.got{border-color:var(--cream)}
  .cell canvas{image-rendering:pixelated; display:block; margin:2px auto 4px}
  .cell .n{font-size:13px}
  .cell .r{font-size:11px; opacity:.85}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <span class="title">🎣 像素钓鱼</span>
    <span class="stats">
      <span class="chip" id="chipTotal">🐟 0</span>
      <span class="chip" id="chipDex">📖 0/12</span>
      <button id="bookBtn">图鉴</button>
      <button id="muteBtn" title="声音">🔊</button>
    </span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="meterWrap">
      <div id="meter"><div id="zone"></div><div id="marker"></div></div>
      <div id="pips"></div>
    </div>
    <div id="hint"></div>
    <div id="card"><div class="box" id="cardBox"></div></div>
  </div>

  <div class="bottom">
    <button id="act">🎣 抛竿</button>
    <div class="sub">点屏幕 / 点按钮 / 按空格键 都可以操作<br>鱼上钩的时候要快点拉，拉线时在橙色亮区里按下<br><a href="./" style="color:#ff9a5c">← 返回游戏大厅</a></div>
  </div>
</div>

<div id="book">
  <div class="panel">
    <div class="hd"><span>📖 鱼类图鉴</span><button id="bookClose">关闭 ✕</button></div>
    <div id="grid"></div>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= 基础 ================= */
const W = 320, H = 180, HORIZON = 96;
const $ = (id) => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
ctx.imageSmoothingEnabled = false;
const rnd = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, p) => a + (b - a) * p;
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };

/* ================= 存档 ================= */
const KEY = 'pixel-fishing-v1';
let save = { total: 0, dex: {} };
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s && typeof s === 'object') save = Object.assign(save, s);
} catch (e) {}
function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= 声音 ================= */
let ac = null, muted = false;
function beep(freq, dur = 0.08, type = 'square', vol = 0.05, delay = 0) {
  if (muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    const t0 = ac.currentTime + delay;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const sfx = {
  cast: () => { beep(520, .06); beep(380, .08, 'square', .05, .06); },
  bite: () => { beep(880, .08); beep(880, .08, 'square', .05, .12); },
  hit: () => { beep(660, .07); beep(880, .09, 'square', .05, .07); },
  miss: () => beep(150, .18, 'sawtooth', .06),
  catch: () => [523, 659, 784, 1047].forEach((f, i) => beep(f, .12, 'square', .05, i * .09)),
  fail: () => { beep(300, .12, 'sawtooth', .05); beep(200, .2, 'sawtooth', .05, .12); },
};

/* ================= 像素图 ================= */
const SPR = {
  small: [
    "...oooo.....",
    "o.oBBBBoo...",
    "ofBBBBeBBo..",
    "ofBLLLLLBo..",
    "o.oBBBBoo...",
    "...oooo.....",
  ],
  long: [
    "..oooooooooo....",
    "ooBBBBBBBBBBoo..",
    "ofBBBBBBBBBeBBo.",
    "ofLLLLLLLLLLLLo.",
    "ooLLLLLLLLLLoo..",
    "..oooooooooo....",
  ],
  round: [
    "...oooooo..",
    "..oBBBBBBo.",
    ".oBBBBeBBBo",
    "oBBBBBBBBBo",
    "ofLLLLLLLBo",
    ".ofLLLLLLo.",
    "..oooooooo.",
  ],
  boot: [
    "..ooooo....",
    "..oBBBo....",
    "..oBBBo....",
    "..oBBBo....",
    ".ooBBBBooo.",
    "oBBBBBBBBBo",
    "ooooooooooo",
  ],
  chest: [
    "..oooooooo..",
    ".oYYYYYYYYo.",
    "oYBYYYYYYBYo",
    "oooooKKooooo",
    "oBBBBKKBBBBo",
    "oBBBBBBBBBBo",
    "oooooooooooo",
  ],
};
const OUT = '#1b1840';
function makeSprite(map, pal) {
  const w = Math.max(...map.map((r) => r.length)), h = map.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    const col = pal[ch]; if (!col) return;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }));
  return c;
}

/* ================= 鱼 ================= */
const RAR = [
  { label: '普通', rounds: 1, zone: 62, speed: 110, color: '#cfe3ff' },
  { label: '少见', rounds: 2, zone: 48, speed: 150, color: '#8fe0a0' },
  { label: '稀有', rounds: 3, zone: 38, speed: 190, color: '#ffd27a' },
  { label: '传说', rounds: 4, zone: 30, speed: 230, color: '#ff9ac8' },
];
const FISH = [
  { id: 'ying', name: '小银鱼', shape: 'small', c: ['#cfd8e8', '#ffffff', '#9fb0cc'], rar: 0, w: 22, size: [4, 9], tip: '一闪一闪的，像碎银子。' },
  { id: 'sardine', name: '沙丁鱼', shape: 'small', c: ['#5f8fd0', '#cfe3ff', '#3f6aa8'], rar: 0, w: 20, size: [8, 16], tip: '成群结队才是它的风格。' },
  { id: 'crucian', name: '鲫鱼', shape: 'small', c: ['#b08a4a', '#e8cf8a', '#8a6a34'], rar: 0, w: 18, size: [12, 25], tip: '最朴实的老朋友。' },
  { id: 'boot', name: '旧靴子', shape: 'boot', junk: true, c: ['#8a5a3a'], rar: 0, w: 8, size: null, tip: '谁把靴子丢海里了？至少是一双。' },
  { id: 'bass', name: '鲈鱼', shape: 'long', c: ['#5f9a6a', '#d6efc8', '#3d7a4c'], rar: 1, w: 12, size: [25, 60], tip: '力气不小，差点把竿子拽走。' },
  { id: 'puffer', name: '河豚', shape: 'round', c: ['#e8c25a', '#fff2b8', '#c0903a'], rar: 1, w: 8, size: [10, 30], tip: '鼓着腮帮子，看起来很生气。' },
  { id: 'snapper', name: '红鲷鱼', shape: 'small', c: ['#e0504a', '#ffc9b8', '#b0302c'], rar: 1, w: 8, size: [20, 50], tip: '红彤彤的，像一小块夕阳。' },
  { id: 'tuna', name: '金枪鱼', shape: 'long', c: ['#2f5fa8', '#c8d8f0', '#1f3f78'], rar: 2, w: 5, size: [80, 200], tip: '海里的跑车，竟然上钩了！' },
  { id: 'koi', name: '锦鲤', shape: 'small', c: ['#ff8a4a', '#ffffff', '#e0602a'], rar: 2, w: 4, size: [40, 90], tip: '据说钓到它会有好运。' },
  { id: 'lantern', name: '灯笼鱼', shape: 'round', c: ['#8a5ad0', '#d8c0ff', '#5a3a9a'], rar: 2, w: 3, size: [15, 40], tip: '身上的小灯一闪一闪。' },
  { id: 'chest', name: '海底宝箱', shape: 'chest', junk: true, c: [], rar: 3, w: 1.5, size: null, tip: '沉甸甸的，里面好像有金币声。' },
  { id: 'golden', name: '黄金鱼', shape: 'small', c: ['#ffd23a', '#fff6b0', '#e0a010'], rar: 3, w: 1, size: [20, 35], tip: '传说中的鱼，你居然钓到了！' },
];
FISH.forEach((f) => {
  let pal;
  if (f.shape === 'boot') pal = { o: OUT, B: '#8a5a3a' };
  else if (f.shape === 'chest') pal = { o: OUT, Y: '#ffd23a', B: '#8a5a3a', K: '#c98a2a' };
  else pal = { o: OUT, e: OUT, B: f.c[0], L: f.c[1], f: f.c[2] };
  f.sprite = makeSprite(SPR[f.shape], pal);
  const sil = {}; Object.keys(pal).forEach((k) => (sil[k] = '#2f2a66'));
  f.silhouette = makeSprite(SPR[f.shape], sil);
});
const shadowSprite = makeSprite(SPR.small, { o: '#0d2a5a', B: '#0d2a5a', L: '#0d2a5a', f: '#0d2a5a', e: '#0d2a5a' });

function rollFish() {
  const total = FISH.reduce((s, f) => s + f.w, 0);
  let r = Math.random() * total;
  for (const f of FISH) { r -= f.w; if (r <= 0) return f; }
  return FISH[0];
}

/* ================= 状态 ================= */
let state = 'idle', stateT = 0, t = 0;
let wait = 0, biteLeft = 0, cur = null, failMsg = '', shake = 0;
let bookOpen = false;
const bob = { x: 140, y: 100 };
let castFrom = { x: 0, y: 0 }, castTo = { x: 220, y: 108 };
const reel = { pos: 0, dir: 1, zx: 0, zw: 40, progress: 0, need: 1, miss: 0, speed: 100 };
const particles = [];

function setState(s, msg) {
  state = s; stateT = 0;
  if (msg !== undefined) failMsg = msg;
  updateUI();
}

/* ================= 场景数据 ================= */
const stars = Array.from({ length: 34 }, () => ({ x: Math.floor(rnd(0, W)), y: Math.floor(rnd(0, 34)), p: rnd(0, 6) }));
const clouds = [
  { x: 30, y: 40, w: 46, s: 2.2 }, { x: 170, y: 28, w: 38, s: 1.6 }, { x: 260, y: 56, w: 52, s: 2.8 },
];
const shadows = Array.from({ length: 3 }, (_, i) => ({ x: rnd(0, W), y: 130 + i * 15, d: i % 2 ? 1 : -1, s: rnd(6, 14) }));
const SKY = ['#2b1b4a', '#4a2a6a', '#7a3a7a', '#b04a7a', '#e0687a', '#f58f6a', '#ffb36b', '#ffd58a'];
const SUN_X = 235;

/* ================= 绘制 ================= */
function line(x0, y0, x1, y1, color) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  ctx.fillStyle = color;
  for (let i = 0; i <= n; i++) {
    ctx.fillRect(Math.round(x0 + (x1 - x0) * i / n), Math.round(y0 + (y1 - y0) * i / n), 1, 1);
  }
}
function sagLine(x0, y0, x1, y1, sag, color) {
  ctx.fillStyle = color;
  const n = 36;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    ctx.fillRect(Math.round(lerp(x0, x1, u)), Math.round(lerp(y0, y1, u) + Math.sin(Math.PI * u) * sag), 1, 1);
  }
}

function rodTip() {
  let bend = 0;
  if (state === 'bite') bend = 3 + Math.sin(t * 60) * 1.5;
  else if (state === 'reel') bend = 3 + Math.sin(t * 20) * 2;
  else if (state === 'wait') bend = Math.sin(t * 2) * 0.6;
  return { x: 142, y: 70 + bend };
}

function drawSky() {
  SKY.forEach((c, i) => R(0, i * 12, W, 12, c));
  for (const s of stars) {
    const a = (Math.sin(t * 2 + s.p) + 1) / 2;
    if (s.y > 30 && a < 0.5) continue;
    ctx.fillStyle = `rgba(255,240,200,${0.35 + 0.65 * a})`;
    ctx.fillRect(s.x, s.y, 1, 1);
  }
  // 太阳（半个，带复古横纹）
  for (let y = 74; y < HORIZON; y++) {
    const dy = HORIZON - y;
    if (y >= 88 && y % 4 === 3) continue;
    const dx = Math.floor(Math.sqrt(22 * 22 - dy * dy));
    R(SUN_X - dx, y, dx * 2, 1, '#ffd07a');
    if (dy <= 17) {
      const dxi = Math.floor(Math.sqrt(17 * 17 - dy * dy));
      R(SUN_X - dxi, y, dxi * 2, 1, '#fff1b8');
    }
  }
  // 云
  for (const c of clouds) {
    ctx.fillStyle = 'rgba(255,196,170,0.6)';
    ctx.fillRect(Math.round(c.x), c.y, c.w, 3);
    ctx.fillRect(Math.round(c.x + 5), c.y - 3, c.w - 12, 3);
    ctx.fillRect(Math.round(c.x + 12), c.y - 6, c.w - 26, 3);
  }
}

function drawSea() {
  R(0, HORIZON, W, 26, '#2a73b5');
  R(0, HORIZON + 26, W, 30, '#1d5f9e');
  R(0, HORIZON + 56, W, H - HORIZON - 56, '#154a82');
  R(0, HORIZON, W, 1, '#ffd58a');
  // 太阳倒影
  for (let i = 0; i < 12; i++) {
    const w = 24 - i + Math.sin(t * 3 + i) * 3;
    const x = SUN_X - w / 2 + Math.sin(t * 2 + i * 0.7) * 2;
    ctx.fillStyle = `rgba(255,190,110,${0.85 - i * 0.055})`;
    ctx.fillRect(Math.round(x), HORIZON + 2 + i * 3, Math.max(2, Math.round(w)), 2);
  }
  // 波纹
  for (let r = 0; r < 12; r++) {
    const y = HORIZON + 6 + r * 7;
    const dir = r % 2 ? 1 : -1;
    for (let k = 0; k < 9; k++) {
      let x = ((k * 41 + r * 23 + t * (6 + r) * dir) % (W + 30) + (W + 30)) % (W + 30) - 15;
      ctx.fillStyle = r < 4 ? 'rgba(255,230,190,0.45)' : 'rgba(140,200,255,0.35)';
      ctx.fillRect(Math.round(x), y, 6 + (r % 3) * 3, 1);
    }
  }
  // 水下鱼影
  ctx.globalAlpha = 0.28;
  for (const s of shadows) {
    ctx.save();
    ctx.translate(Math.round(s.x), Math.round(s.y));
    if (s.d > 0) { ctx.scale(-1, 1); ctx.drawImage(shadowSprite, -shadowSprite.width, 0); }
    else ctx.drawImage(shadowSprite, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawPier() {
  [18, 58, 98].forEach((x) => R(x, 120, 5, 60, '#4a2f17'));
  R(0, 112, 106, 8, '#8b5a2b');
  R(0, 112, 106, 2, '#b07a3e');
  for (let x = 10; x < 106; x += 14) R(x, 114, 1, 6, '#5a3a1c');
  R(0, 120, 106, 1, '#3a2410');
}

function drawFisher() {
  R(96, 108, 9, 4, '#3b4a7a');
  R(103, 111, 4, 11, '#3b4a7a');
  R(103, 121, 5, 3, '#2a1a14');
  R(88, 98, 9, 13, '#e0603a');
  R(88, 98, 2, 13, '#b8472a');
  R(90, 90, 7, 8, '#f2c9a0');
  R(95, 93, 1, 1, OUT);
  R(88, 87, 11, 3, '#e8c25a');
  R(90, 84, 7, 3, '#e8c25a');
  R(90, 86, 7, 1, '#c0392b');
  R(95, 102, 6, 3, '#e0603a');
  R(100, 102, 2, 3, '#f2c9a0');
}

function drawRodAndLine() {
  const tip = rodTip();
  line(101, 103, tip.x, tip.y, '#3b2a1c');
  line(101, 104, tip.x, tip.y + 1, '#6b4a2c');
  R(tip.x - 1, tip.y - 1, 2, 2, '#ffd27a');
  if (state === 'idle' || state === 'caught' || state === 'fail') {
    line(tip.x, tip.y, tip.x + 2, tip.y + 26, '#f5e6c8');
    R(tip.x + 1, tip.y + 26, 2, 2, '#cfd8e8');
    return;
  }
  const sag = state === 'wait' ? 6 : state === 'cast' ? 3 : 1.5;
  sagLine(tip.x, tip.y, bob.x, bob.y - 3, sag, 'rgba(255,240,215,0.9)');
  // 水波圈
  if (state !== 'cast') {
    for (let k = 0; k < 2; k++) {
      const ph = (t * (state === 'wait' ? 0.6 : 1.6) + k * 0.5) % 1;
      const w = 4 + ph * 20;
      ctx.fillStyle = `rgba(255,255,255,${(1 - ph) * 0.5})`;
      ctx.fillRect(Math.round(bob.x - w / 2), Math.round(bob.y + 2), Math.round(w), 1);
    }
  }
  // 浮漂
  R(bob.x - 2, bob.y - 4, 4, 3, '#ff4a4a');
  R(bob.x - 2, bob.y - 1, 4, 2, '#ffffff');
  R(bob.x - 1, bob.y + 1, 2, 1, 'rgba(0,0,0,0.3)');
  // 感叹号
  if (state === 'bite' && Math.floor(t * 8) % 2 === 0) {
    R(bob.x - 6, bob.y - 26, 12, 14, '#ffffff');
    R(bob.x - 1, bob.y - 24, 3, 7, '#c0392b');
    R(bob.x - 1, bob.y - 15, 3, 2, '#c0392b');
  }
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.vy += 140 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }
}
function burst(x, y, n, colors, power = 50) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: rnd(-power, power), vy: rnd(-power * 1.6, -power * 0.4),
      life: rnd(0.4, 0.9), c: colors[Math.floor(Math.random() * colors.length)],
    });
  }
}

function draw(dt) {
  ctx.save();
  if (shake > 0.2) ctx.translate(Math.round(rnd(-shake, shake)), Math.round(rnd(-shake, shake)));
  drawSky();
  drawSea();
  drawPier();
  drawFisher();
  drawRodAndLine();
  drawParticles(dt);
  ctx.restore();
}

/* ================= 逻辑 ================= */
function startCast() {
  const tip = rodTip();
  castFrom = { x: tip.x, y: tip.y };
  castTo = { x: Math.round(rnd(185, 275)), y: Math.round(rnd(106, 118)) };
  bob.x = castFrom.x; bob.y = castFrom.y;
  sfx.cast();
  setState('cast');
}

function startReel() {
  const rar = RAR[cur.rar];
  reel.need = rar.rounds;
  reel.progress = 0; reel.miss = 0;
  reel.speed = rar.speed * (cur.junk && cur.shape === 'boot' ? 0.9 : 1);
  reel.zw = rar.zone * (cur.shape === 'boot' ? 1.2 : 1);
  reel.pos = 0; reel.dir = 1;
  newZone();
  sfx.hit();
  burst(bob.x, bob.y, 10, ['#ffffff', '#bfe3ff'], 40);
  setState('reel');
}
function newZone() {
  reel.zx = rnd(24, 200 - reel.zw - 24);
}

function pull() {
  const hit = reel.pos >= reel.zx && reel.pos <= reel.zx + reel.zw;
  const meter = $('meter');
  if (hit) {
    reel.progress++;
    sfx.hit();
    burst(bob.x, bob.y, 8, ['#ffffff', '#ffd27a'], 45);
    meter.classList.remove('flash'); void meter.offsetWidth; meter.classList.add('flash');
    if (reel.progress >= reel.need) { catchIt(); return; }
    newZone();
    reel.speed *= 1.1;
  } else {
    reel.miss++;
    shake = 4;
    sfx.miss();
    if (reel.miss >= 2) { sfx.fail(); setState('fail', '鱼挣脱了…下次加油！'); return; }
  }
  updateUI();
}

function catchIt() {
  const f = cur;
  const e = save.dex[f.id] || { count: 0, best: 0 };
  const isNew = e.count === 0;
  let size = null, isRecord = false;
  if (f.size) {
    size = Math.round(rnd(f.size[0], f.size[1]));
    if (size > e.best) { isRecord = !isNew; e.best = size; }
  }
  e.count++;
  save.dex[f.id] = e;
  save.total++;
  persist();
  burst(bob.x, bob.y, 26, ['#ffd27a', '#ff9a5c', '#ffffff', '#ff9ac8'], 70);
  sfx.catch();
  setState('caught');
  showCard(f, size, isNew, isRecord);
  updateStats();
}

function act() {
  if (bookOpen) return;
  switch (state) {
    case 'idle': startCast(); break;
    case 'wait': sfx.fail(); setState('fail', '拉太早了，鱼被吓跑了…'); break;
    case 'bite': startReel(); break;
    case 'reel': pull(); break;
    case 'caught': if (stateT > 0.35) closeCard(); break;
    case 'fail': if (stateT > 0.35) setState('idle'); break;
  }
}

function update(dt) {
  t += dt; stateT += dt;
  shake = Math.max(0, shake - dt * 14);
  for (const c of clouds) { c.x += c.s * dt; if (c.x > W + 10) c.x = -c.w - 10; }
  for (const s of shadows) {
    s.x += s.d * s.s * dt;
    if (s.x > W + 20) s.x = -20;
    if (s.x < -20) s.x = W + 20;
  }
  const tip = rodTip();
  switch (state) {
    case 'cast': {
      const p = Math.min(1, stateT / 0.55);
      bob.x = lerp(castFrom.x, castTo.x, p);
      bob.y = lerp(castFrom.y, castTo.y, p) - Math.sin(Math.PI * p) * 34;
      if (p >= 1) {
        bob.x = castTo.x; bob.y = castTo.y;
        burst(bob.x, bob.y, 8, ['#ffffff', '#bfe3ff'], 35);
        wait = rnd(2.5, 6);
        setState('wait');
      }
      break;
    }
    case 'wait':
      bob.y = castTo.y + Math.sin(t * 2.2) * 1.2;
      if (Math.random() < dt * 0.5) burst(bob.x + rnd(-8, 8), bob.y + 1, 1, ['#ffffff'], 6);
      wait -= dt;
      if (wait <= 0) {
        cur = rollFish();
        biteLeft = 1.15;
        sfx.bite();
        try { navigator.vibrate && navigator.vibrate(80); } catch (e) {}
        setState('bite');
      }
      break;
    case 'bite':
      bob.y = castTo.y + 4 + Math.sin(t * 50) * 1.5;
      bob.x = castTo.x + Math.sin(t * 40) * 1;
      biteLeft -= dt;
      if (biteLeft <= 0) { sfx.fail(); setState('fail', '慢了一步，鱼跑掉了…'); }
      break;
    case 'reel': {
      reel.pos += reel.dir * reel.speed * dt;
      if (reel.pos >= 200) { reel.pos = 200; reel.dir = -1; }
      if (reel.pos <= 0) { reel.pos = 0; reel.dir = 1; }
      const pr = reel.progress / reel.need;
      bob.x = lerp(castTo.x, tip.x + 36, pr * 0.65) + Math.sin(t * 24) * 3;
      bob.y = castTo.y + Math.sin(t * 18) * 2;
      if (Math.random() < 0.5) burst(bob.x + rnd(-6, 6), bob.y, 1, ['#ffffff', '#bfe3ff'], 30);
      updateMeter();
      break;
    }
    default: break;
  }
}

/* ================= UI ================= */
const hint = $('hint'), actBtn = $('act'), meterWrap = $('meterWrap');
function pipsText() {
  let s = '';
  for (let i = 0; i < reel.need; i++) s += i < reel.progress ? '●' : '○';
  s += '　';
  for (let i = 0; i < 2; i++) s += i < reel.miss ? '✖' : '♡';
  return s;
}
function updateMeter() {
  $('zone').style.left = (reel.zx / 200 * 100) + '%';
  $('zone').style.width = (reel.zw / 200 * 100) + '%';
  $('marker').style.left = (reel.pos / 200 * 100) + '%';
}
function updateUI() {
  const H_ = {
    idle: '点击屏幕 / 按空格：抛竿',
    cast: '嗖——',
    wait: '等待鱼儿上钩…（别太早拉！）',
    bite: '上钩了！！快拉！！',
    reel: '在橙色亮区里按下！',
    caught: '',
    fail: failMsg,
  };
  const B_ = { idle: '🎣 抛竿', cast: '…', wait: '⏳ 等待中', bite: '‼ 拉！', reel: '🎣 拉线！', caught: '继续', fail: '再来一次' };
  hint.textContent = H_[state] || '';
  hint.style.display = H_[state] ? 'block' : 'none';
  hint.classList.toggle('alert', state === 'bite');
  actBtn.textContent = B_[state];
  actBtn.classList.toggle('alert', state === 'bite');
  meterWrap.style.display = state === 'reel' ? 'block' : 'none';
  if (state === 'reel') { $('pips').textContent = pipsText(); updateMeter(); }
}
function updateStats() {
  $('chipTotal').textContent = '🐟 ' + save.total;
  $('chipDex').textContent = '📖 ' + Object.keys(save.dex).length + '/' + FISH.length;
}

function iconCanvas(f, known) {
  const spr = known ? f.sprite : f.silhouette;
  const sc = Math.max(1, Math.min(Math.floor(64 / spr.width), Math.floor(40 / spr.height)));
  const c = document.createElement('canvas');
  c.width = spr.width * sc; c.height = spr.height * sc;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(spr, 0, 0, c.width, c.height);
  return c;
}

function showCard(f, size, isNew, isRecord) {
  const box = $('cardBox');
  box.innerHTML = '';
  const rar = RAR[f.rar];
  const h2 = document.createElement('h2');
  h2.textContent = f.junk && f.shape === 'boot' ? '钓到了…' : f.shape === 'chest' ? '哇！！' : '钓到了！';
  box.appendChild(h2);
  const big = document.createElement('canvas');
  const sw = f.sprite.width, sh = f.sprite.height;
  const k = Math.max(2, Math.min(Math.floor(130 / sw), Math.floor(76 / sh)));
  big.width = sw * k; big.height = sh * k;
  const g = big.getContext('2d'); g.imageSmoothingEnabled = false;
  g.drawImage(f.sprite, 0, 0, big.width, big.height);
  box.appendChild(big);
  const nm = document.createElement('div');
  nm.className = 'name'; nm.textContent = f.name;
  box.appendChild(nm);
  const meta = document.createElement('div');
  meta.className = 'meta';
  const rs = document.createElement('span');
  rs.style.color = rar.color; rs.textContent = '【' + rar.label + '】';
  meta.appendChild(rs);
  if (size !== null) meta.appendChild(document.createTextNode(' ' + size + ' cm'));
  if (isNew) { const t1 = document.createElement('span'); t1.className = 'tag'; t1.textContent = '新发现'; meta.appendChild(document.createTextNode(' ')); meta.appendChild(t1); }
  if (isRecord) { const t2 = document.createElement('span'); t2.className = 'tag'; t2.textContent = '新纪录'; meta.appendChild(document.createTextNode(' ')); meta.appendChild(t2); }
  box.appendChild(meta);
  const tip = document.createElement('div');
  tip.className = 'tip'; tip.textContent = f.tip;
  box.appendChild(tip);
  const go = document.createElement('div');
  go.className = 'go'; go.textContent = '点击继续';
  box.appendChild(go);
  $('card').style.display = 'flex';
}
function closeCard() {
  $('card').style.display = 'none';
  setState('idle');
}

function openBook() {
  const grid = $('grid');
  grid.innerHTML = '';
  FISH.forEach((f) => {
    const e = save.dex[f.id];
    const cell = document.createElement('div');
    cell.className = 'cell' + (e ? ' got' : '');
    cell.appendChild(iconCanvas(f, !!e));
    const n = document.createElement('div'); n.className = 'n'; n.textContent = e ? f.name : '？？？';
    cell.appendChild(n);
    const r = document.createElement('div'); r.className = 'r';
    if (e) {
      r.textContent = RAR[f.rar].label + ' ×' + e.count + (e.best ? ' · 最大' + e.best + 'cm' : '');
      r.style.color = RAR[f.rar].color;
    } else r.textContent = '未发现';
    cell.appendChild(r);
    grid.appendChild(cell);
  });
  $('book').style.display = 'flex';
  bookOpen = true;
}
function closeBook() { $('book').style.display = 'none'; bookOpen = false; }

/* ================= 输入 ================= */
$('stage').addEventListener('pointerdown', (e) => { e.preventDefault(); act(); });
actBtn.addEventListener('click', act);
$('bookBtn').addEventListener('click', openBook);
$('bookClose').addEventListener('click', closeBook);
$('book').addEventListener('pointerdown', (e) => { if (e.target === $('book')) closeBook(); });
$('muteBtn').addEventListener('click', () => {
  muted = !muted;
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeBook(); return; }
  if (e.code === 'Space' || e.key === 'Enter') {
    if (e.target && e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    if (!e.repeat) act();
  }
});

/* ================= 主循环 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!bookOpen) update(dt);
  draw(bookOpen ? 0 : dt);
  requestAnimationFrame(frame);
}
updateStats();
updateUI();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
