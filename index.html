<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>像素游戏厅</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --w:#fff; --k:#000; --g:#777; --g2:#333; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; min-height:100%}
  body{
    background:var(--k); color:var(--w);
    font-family:'DotGothic16',ui-monospace,Menlo,"PingFang SC","Microsoft YaHei",monospace;
    display:flex; justify-content:center; padding:0 14px 40px;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }
  /* 顶部棋盘格装饰条 */
  body::before{
    content:''; position:fixed; left:0; right:0; top:0; height:16px; z-index:5;
    background:
      conic-gradient(#fff 25%, #000 0 50%, #fff 0 75%, #000 0) 0 0/16px 16px;
    border-bottom:4px solid #fff;
  }
  main{width:100%; max-width:560px; padding-top:48px}
  header{text-align:center; margin-bottom:26px}
  .en{
    font-family:'Press Start 2P',ui-monospace,monospace; font-size:clamp(20px,6.4vw,34px);
    line-height:1.4; letter-spacing:2px; text-shadow:4px 4px 0 var(--g2);
  }
  .zh{margin-top:10px; font-size:18px; letter-spacing:6px}
  .status{margin-top:12px; font-size:13px; color:var(--g)}
  .cursor{display:inline-block; width:9px; height:15px; background:var(--w); vertical-align:-2px; margin-left:4px; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  nav{display:flex; flex-direction:column; gap:14px}
  .card{
    display:grid; grid-template-columns:auto 72px 1fr 22px; align-items:center; gap:12px;
    padding:12px 14px; color:var(--w); text-decoration:none;
    border:4px solid var(--w); box-shadow:6px 6px 0 var(--g2);
    background:var(--k); outline:none; position:relative;
  }
  .card .no{font-family:'Press Start 2P',monospace; font-size:14px}
  .card canvas{width:64px; height:48px; image-rendering:pixelated; display:block}
  .card .name{font-size:20px; line-height:1.3}
  .card .desc{font-size:13px; color:#bbb; margin-top:3px}
  .card .go{font-family:'Press Start 2P',monospace; font-size:14px; opacity:0}
  a.card:hover, a.card:focus-visible{background:var(--w); color:var(--k); transform:translate(-2px,-2px); box-shadow:8px 8px 0 var(--g2)}
  a.card:hover canvas, a.card:focus-visible canvas{filter:invert(1)}
  a.card:hover .desc, a.card:focus-visible .desc{color:#444}
  a.card:hover .go, a.card:focus-visible .go{opacity:1; animation:nudge .5s steps(2) infinite}
  @keyframes nudge{50%{transform:translateX(4px)}}
  a.card:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--g2)}
  .card.locked{border-style:dashed; border-color:var(--g); color:var(--g); box-shadow:none; cursor:not-allowed}
  .card.locked .desc{color:#555}
  .card.locked .tag{
    position:absolute; right:10px; top:-12px; background:var(--k); padding:0 6px;
    font-family:'Press Start 2P',monospace; font-size:9px; color:var(--g);
  }
  footer{margin-top:30px; text-align:center; font-size:12px; color:var(--g); line-height:2}
  footer .line{border-top:4px dotted var(--g2); margin-bottom:12px}
  @media (max-width:420px){
    .card{grid-template-columns:auto 56px 1fr 16px; gap:8px; padding:10px}
    .card canvas{width:56px; height:42px}
    .card .name{font-size:17px}
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="en">PIXEL<br>GAMES</div>
    <div class="zh">像素游戏厅</div>
    <div class="status" id="status">LOADING<span class="cursor"></span></div>
  </header>
  <nav id="list"></nav>
  <footer>
    <div class="line"></div>
    <div>电脑：↑ ↓ 选择 · Enter 进入　手机：直接点击</div>
    <div>更多游戏制作中…</div>
  </footer>
</main>

<script>
/* ===== 要加新游戏，只需要在这里加一行 =====
   href 填 null 表示"即将上线"（灰色、不能点）*/
const GAMES = [
  { name: '电子宠物', desc: '养一只会眨眼的像素小猫', href: 'pixel-pet.html', icon: 'cat' },
  { name: '像素钓鱼', desc: '日落海边，收集 12 种鱼', href: 'pixel-fishing.html', icon: 'fish' },
  { name: '像素音乐盒', desc: '自己编一段像素旋律', href: null, icon: 'note' },
  { name: '？？？？？', desc: '敬请期待', href: null, icon: 'lock' },
];

const ICONS = {
  cat: [
    ".##..........##.",
    ".#k#........#k#.",
    ".####......####.",
    ".##############.",
    "################",
    "################",
    "####k######k####",
    "####k##gg##k####",
    "######k##k######",
    ".##############.",
    "..############..",
    "....########....",
  ],
  fish: [
    ".....######.....",
    "..#.##########..",
    ".###.####k#####.",
    "#####.##########",
    ".###.##########.",
    "..#.##########..",
    ".....######.....",
  ],
  note: [
    "....##########..",
    "....##########..",
    "....##......##..",
    "....##......##..",
    "....##......##..",
    "....##......##..",
    "..####....####..",
    ".#####...#####..",
    "..###.....###...",
  ],
  lock: [
    "....######......",
    "...##....##.....",
    "...##....##.....",
    "..##########....",
    "..##########....",
    "..####kk####....",
    "..####kk####....",
    "..##########....",
    "..##########....",
  ],
};

function drawIcon(cv, name, dim) {
  const map = ICONS[name];
  cv.width = 16; cv.height = 12;
  const g = cv.getContext('2d');
  const oy = Math.floor((12 - map.length) / 2);
  const col = { '#': dim ? '#777' : '#fff', 'k': '#000', 'g': '#888' };
  map.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = col[ch]; g.fillRect(x, y + oy, 1, 1);
  }));
}

const list = document.getElementById('list');
let online = 0;
GAMES.forEach((g, i) => {
  const el = document.createElement(g.href ? 'a' : 'div');
  el.className = 'card' + (g.href ? '' : ' locked');
  if (g.href) { el.href = g.href; online++; }
  const no = document.createElement('div');
  no.className = 'no'; no.textContent = String(i + 1).padStart(2, '0');
  const cv = document.createElement('canvas');
  drawIcon(cv, g.icon, !g.href);
  const txt = document.createElement('div');
  const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = g.name;
  const ds = document.createElement('div'); ds.className = 'desc'; ds.textContent = g.desc;
  txt.appendChild(nm); txt.appendChild(ds);
  const go = document.createElement('div'); go.className = 'go'; go.textContent = '▶';
  el.appendChild(no); el.appendChild(cv); el.appendChild(txt); el.appendChild(go);
  if (!g.href) {
    const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'SOON';
    el.appendChild(tag);
  }
  list.appendChild(el);
});
document.getElementById('status').innerHTML = 'ONLINE ' + online + '/' + GAMES.length + '<span class="cursor"></span>';

/* 键盘：上下选择，回车进入（Tab 也可以） */
window.addEventListener('keydown', (e) => {
  const links = [...document.querySelectorAll('a.card')];
  if (!links.length) return;
  const i = links.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); links[(i + 1) % links.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); links[(i - 1 + links.length) % links.length].focus(); }
});
</script>
</body>
</html>
